[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpulock"
version = "0.1.0"
description = "GPU lock wrapper for correctness and benchmark workloads"
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-Proprietary"
authors = [
  { name = "gpulock maintainers" },
]
keywords = ["gpu", "lock", "benchmark", "cuda", "nvidia"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]
dependencies = [
  "setproctitle>=1.3; platform_system == 'Linux'",
  "supervisor>=4.2",
]

[project.scripts]
gpulock = "gpulock.cli:main"
gpuunlock = "gpulock.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
